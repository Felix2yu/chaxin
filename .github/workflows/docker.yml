name: Build and push Docker image to GHCR

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 各平台在原生架构 runner 上构建（amd64 -> ubuntu-latest, arm64 -> ubuntu-24.04-arm），
  # 无需 QEMU 模拟。Dockerfile 分层与 type=gha 缓存使 npm ci / go mod download 等层可复用。
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            suffix: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            suffix: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker meta (platform tag)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long,prefix=sha-

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (${{ matrix.platform }})
        uses: docker/build-push-action@v7
        with:
          context: .
          # PR 仅做构建测试，不推送；push/tag 才推送镜像
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}-${{ matrix.suffix }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: ${{ matrix.platform }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 将各平台单架构镜像合并为多架构 manifest。
  # - push/main → latest, main, semver, sha-xxx
  # - push/tag v* → semver tag
  # - pull_request → dev
  merge:
    name: Merge multi-arch manifest
    # PR 仅构建测试，不推送，因此跳过合并 manifest
    if: github.event_name != 'pull_request'
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta (final tags)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=raw,value=dev,enable=${{ github.event_name == 'pull_request' }}

      - name: Merge manifest
        run: |
          image="ghcr.io/${{ github.repository }}"
          image="${image,,}"
          refs="$image:sha-${{ github.sha }}-amd64 $image:sha-${{ github.sha }}-arm64"
          while read -r tag; do
            [ -n "$tag" ] && docker buildx imagetools create -t "$tag" $refs
          done <<< "${{ steps.meta.outputs.tags }}"
