name: Test and Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (go test + coverage)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # 前端为纯静态资源（HTML/CSS/JS），无 Node 依赖；构建它生成 internal/web/dist/index.html，
      # 供 //go:embed all:dist 内嵌，使 SPA fallback 测试能命中真实入口。
      - name: Build frontend (static)
        run: sh web/build.sh

      - name: Run tests with coverage
        run: go test ./... -count=1 -coverprofile=coverage.out -covermode=atomic

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.out
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
